<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análisis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e0e14;
      color: #f2f2f5;
      padding: 48px 24px;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 24px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    li a {
      display: block;
      padding: 16px 20px;
      background: #17171f;
      border: 1px solid #26262f;
      border-radius: 10px;
      color: #f2f2f5;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    li a:hover {
      border-color: #a100ff;
      background: #1c1c26;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Análisis</h1>
    <ul>
      <li><a href="/analisis/servid">Servid</a></li>
    </ul>
  </div>
</body>
</html>
